<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1535"/>
      <stop offset="50%" stop-color="#060c20"/>
      <stop offset="100%" stop-color="#02050e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle with Gorilla Glass Glow -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#bg)" stroke="url(#border)" stroke-width="20"/>

  <!-- Top Right Glowing Sparkle / Star -->
  <polygon points="380,105 394,132 422,145 394,158 380,185 366,158 338,145 366,132" fill="#22d3ee" opacity="0.95"/>

  <!-- KO Monogram -->
  <text x="246" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="205" font-weight="900" fill="url(#brand)" text-anchor="middle" letter-spacing="-10">KO</text>
  
  <!-- Sleek Java / Engineering Underline Pill -->
  <rect x="146" y="372" width="220" height="14" rx="7" fill="url(#brand)" opacity="0.9"/>
</svg>
